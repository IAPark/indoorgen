# cargo deny check licenses : every dependency must be GPL-3.0-or-later compatible.
[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "0BSD", "BSL-1.0", "Unlicense",
  "GPL-3.0", "GPL-3.0-or-later", "LGPL-2.1", "LGPL-2.1-or-later", "LGPL-3.0", "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"

# russimp(-sys) ship the assimp license text (BSD-3-Clause) as license-file without an SPDX field
[[licenses.clarify]]
name = "russimp"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0x54c778fa }]

[[licenses.clarify]]
name = "russimp-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0xead3f096 }]
