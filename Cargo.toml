[package]
name = "indoorgen"
version = "0.1.0"
edition = "2021"
description = "Procedural indoor scene generator in Rust (derived from Princeton Infinigen Indoors)"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/indoorgen"
readme = "README.md"

[workspace]
members = ["crates/*", "dev"]
resolver = "2"

[workspace.dependencies]
geos = { version = "11", features = ["v3_11_0"] }
indexmap = "2"
nalgebra = "0.33"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
md5 = "0.8.1"
earcutr = "0.5.0"
parry3d-f64 = "0.18"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
robust = "1.2"
cc = "1"

[dependencies]
meshopt = "0.7"
geos = { workspace = true }
indexmap = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
md5 = { workspace = true }
earcutr = { workspace = true }
parry3d-f64 = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
ig_core = { path = "crates/ig_core" }
ig_exbool = { path = "crates/ig_exbool" }
ig_bm = { path = "crates/ig_bm" }
ig_geom = { path = "crates/ig_geom" }
ig_kit = { path = "crates/ig_kit" }
ig_gn = { path = "crates/ig_gn" }
ig_furn = { path = "crates/ig_furn" }
ig_rooms = { path = "crates/ig_rooms" }
ig_assets = { path = "crates/ig_assets" }
ig_mess = { path = "crates/ig_mess" }
ig_people = { path = "crates/ig_people" }
ig_cams = { path = "crates/ig_cams" }

[profile.release]
opt-level = 3
debug = 0

# fast edit-compile loop: incremental, many codegen units (runtime ~10-30% slower than release)
[profile.fast]
inherits = "release"
opt-level = 2
incremental = true
codegen-units = 256
