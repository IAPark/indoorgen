[package]
name = "indoorgen-dev"
version = "0.1.0"
edition = "2021"
description = "One-off probes and comparison tools for indoorgen development (not built by default)"
license = "GPL-3.0-or-later"
publish = false
autobins = false

[dependencies]
indoorgen = { path = ".." }
geos = { workspace = true }
indexmap = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
md5 = { workspace = true }
earcutr = { workspace = true }
parry3d-f64 = { workspace = true }
mimalloc = { version = "0.1", default-features = false }

