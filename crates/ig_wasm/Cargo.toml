[package]
name = "ig_wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "wasm-bindgen module: one furnished room of the Infinigen-Indoors Rust port as GLB bytes, in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indoorgen = { path = "../..", default-features = false }
ig_core = { path = "../ig_core" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde_json = { workspace = true }
serde = { workspace = true }
web-time = "1"
miniz_oxide = "0.8"
talc = { version = "5", optional = true }

[features]
default = []
