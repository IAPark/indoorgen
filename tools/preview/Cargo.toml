[package]
name = "preview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]

[profile.release]
opt-level = 3
debug = false

[dependencies]
half = "2"
ig_shade = { path = "../../crates/ig_shade" }
bytemuck = "1.25.2"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
rayon = "1.12.0"
serde_json = "1.0.154"
wgpu = "30.0.1"
obvhs = "0.4.0"
web-time = "1"

[patch.crates-io]
# (its timers use std's clock, which panics in a browser)
obvhs = { path = "vendor/obvhs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
meshopt = "0.7"
mimalloc = { version = "0.1", default-features = false }
